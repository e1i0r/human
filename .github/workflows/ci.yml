name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action must catch the sample. A green run here means it stopped working.
      - id: lint
        uses: ./
        continue-on-error: true
        with:
          files: examples/slop.md
          args: --brief
      - if: steps.lint.outcome != 'failure'
        run: |
          echo "human passed examples/slop.md; it should have failed"
          exit 1
      # And the README must pass: it carries the badge.
      - uses: ./
        with:
          files: README.md
